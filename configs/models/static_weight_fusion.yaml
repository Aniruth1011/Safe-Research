model: static_weight_fusion
head: mlp            # mlp | linear; final choice comes from the shared probe spec (B6)
hidden_dim: 64
dropout: 0.0
learn_weights: true  # false = fixed mix at init_weights (uniform if null)
init_weights: null
learn_scale: true
proj_dim: 64         # per-layer Linear(D, 64) to a shared dimension (row 21); null = pure scalar mix of z-scored layers
