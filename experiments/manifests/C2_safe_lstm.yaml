experiment:
  id: C2
  experiments_row: 2
  name: reproduce_safe_final_layer_lstm
  owner: Adarsh
  model: SAFE LstmModel (failure_prob/model/lstm.py), unchanged
  status: TRAINED   # trained + selected on seen_val; unseen_test is evaluated only in N3
  seen_val_metrics: {falert_early_roc_auc: "0.7418 +- 0.0214", falert_early_prc_auc: "0.7532 +- 0.0119", roc_auc_tq1.0: "0.8093 +- 0.0257", tpr_at_5_fpr: "0.2723 +- 0.0332", tpr_at_10_fpr: "0.4038 +- 0.0239"}
  winner_rerun_job: 14251667
  data:
    cache: shared cache v1 (collection/load_cache.py), dataset=openvla_cache
    layer: 32          # block 32 after final RMSNorm = SAFE's feature
