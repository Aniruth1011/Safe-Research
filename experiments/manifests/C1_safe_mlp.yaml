experiment:
  id: C1
  experiments_row: 1
  name: reproduce_safe_final_layer_mlp
  owner: Adarsh
  model: SAFE IndepModel (failure_prob/model/indep.py), unchanged
  status: TRAINED   # trained + selected on seen_val; unseen_test is evaluated only in N3
  seen_val_metrics: {falert_early_roc_auc: "0.7552 +- 0.0030", falert_early_prc_auc: "0.7494 +- 0.0042", tpr_at_5_fpr: "0.1690 +- 0.0000", tpr_at_10_fpr: "0.3756 +- 0.0351"}
  winner_rerun_job: 14243293
  data:
    cache: shared cache v1 (collection/load_cache.py), dataset=openvla_cache
    layer: 32          # block 32 after final RMSNorm = SAFE's feature
    pool: mean
    splits: train (210 episodes) for training, seen_val (140) for selection; unseen_test never loaded
  grid: lr {1e-4, 3e-4, 1e-3} x lambda_reg {1e-3, 1e-2, 1e-1, 1} x seed {0, 1, 2}; batch 64; 1000 epochs
  selection: argmax over configs of mean falert_early_roc_auc/model_val_seen (seeds 0/1/2), final epoch
  selected_config: {lr: 3.0e-4, lambda_reg: 1.0, batch_size: 64, n_epochs: 1000}
  trainable_parameters: 1049089
  implementation_files:
    - failure_prob/data/openvla_cache.py
    - failure_prob/conf/__init__.py
    - failure_prob/conf/dataset/openvla_cache.yaml
    - scripts/carc/safe_baseline.slurm
    - scripts/collect_safe_runs.py
  training_command: sbatch --export=ALL,MODEL=indep --job-name=c1-mlp scripts/carc/safe_baseline.slurm
  selection_command: python scripts/collect_safe_runs.py <OUT>/wandb --out <OUT>/selection.csv
  code_commit: ea1420d
  slurm_job: 14240563
  results:
    - experiments/results/C1_safe_mlp/runs.csv
    - experiments/results/C1_safe_mlp/selection.csv
    - experiments/results/C1_safe_mlp/winner.json
    - experiments/results/C1_safe_mlp/winner_episode_metrics.csv
    - experiments/results/C1_safe_mlp/scores_seen_val_s{0,1,2}.csv
  note: single fixed split (SAFE seed-0 unseen tasks); seen_val; selection-optimistic. Not comparable to SAFE's published 3-split numbers.
